:root{

  --accent:#1E5B4F; --band:#002F2A; --band-ink:#E6D194; --guinda:#611232; --oro:#A57F2C;
  --ok:#2E7D4F; --warn:#B9820F; --bad:#B3261E; --done:#002F2A; --na:#9AA6A2;
  --ok-bg:#E3F1E8; --warn-bg:#FBF0D6; --bad-bg:#F8E1DF; --done-bg:#DCE9E5;
  --font-d:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-b:'Barlow','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1715; --surface:#14201E; --ink:#E7EEEB; --muted:#9BABA6; --line:#293936;
    --accent:#7CC3B0; --band:#08221F; --band-ink:#E6D194; --guinda:#D1789A; --oro:#D6B163;
    --ok:#62C08B; --warn:#E5B54A; --bad:#F27A70; --done:#A8DACB; --na:#6C7B77;
    --ok-bg:#16352A; --warn-bg:#3A2F12; --bad-bg:#3E1D1B; --done-bg:#183632;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1715; --surface:#14201E; --ink:#E7EEEB; --muted:#9BABA6; --line:#293936;
  --accent:#7CC3B0; --band:#08221F; --band-ink:#E6D194; --guinda:#D1789A; --oro:#D6B163;
  --ok:#62C08B; --warn:#E5B54A; --bad:#F27A70; --done:#A8DACB; --na:#6C7B77;
  --ok-bg:#16352A; --warn-bg:#3A2F12; --bad-bg:#3E1D1B; --done-bg:#183632;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.band{background:var(--band);color:var(--band-ink);padding:22px 20px 18px}
.band-in,.main{max-width:1180px;margin:0 auto}
.band h1{font-family:var(--font-d);font-weight:700;font-size:clamp(22px,3.2vw,32px);margin:0;text-wrap:balance}
.band p{margin:6px 0 0;color:#F3EEDD;opacity:.85}
.main{padding:18px 16px 60px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-family:var(--font-d);font-size:20px;margin:0 0 10px;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}
.carga{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--ok-bg)}
.drop strong{font-size:16px}
.fecha{display:flex;flex-direction:column;gap:4px}
.fecha input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
:root[data-theme="dark"] .btn:not(.sec):not(.peligro){color:#0D1715}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.sec):not(.peligro){color:#0D1715}}
.btn.sec{background:transparent;color:var(--accent);display:inline-flex;align-items:center}
.btn.peligro{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.drop:focus-visible,tr.fila:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.aviso{border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.aviso.prev{background:var(--warn-bg);border:1px solid var(--warn)}
.aviso.okk{background:var(--ok-bg);border:1px solid var(--ok)}
.aviso.err{background:var(--bad-bg);border:1px solid var(--bad)}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .lab{font-size:13px;color:var(--muted)}
.kpi .val{font-family:var(--font-d);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.kpi .sub{font-size:13px;color:var(--muted);margin-top:2px}
.barra{height:8px;background:var(--line);border-radius:4px;position:relative;overflow:visible;min-width:90px}
.barra i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.barra b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--oro)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-size:12px;margin-left:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
td.c,th.c{text-align:center}
tr.fila{cursor:pointer}
tr.fila:hover td{background:var(--bg)}
tr.det td{background:var(--bg);padding:10px 12px}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.e-done{background:var(--done-bg);color:var(--done)}
.e-ok{background:var(--ok-bg);color:var(--ok)}
.e-warn{background:var(--warn-bg);color:var(--warn)}
.e-bad{background:var(--bad-bg);color:var(--bad)}
.e-na{background:var(--line);color:var(--muted)}
.heat td.g{min-width:86px;text-align:center;font-weight:600}
.heat td.g.e-ok,.heat td.g.e-warn,.heat td.g.e-bad,.heat td.g.e-done{border-left:2px solid var(--surface)}
.heat td.g small{display:block;font-weight:400;font-size:11px;opacity:.85}
.leyenda{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted);align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.imgs figure{margin:0;display:grid;gap:8px}
.imgs img{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
pre.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--font-b);font-size:14px;max-height:420px;overflow:auto;margin:0}
.bandtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bandtop .volver{margin-bottom:0}
.chipnube{display:inline-flex;align-items:center;gap:8px;border-radius:16px;padding:4px 12px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#F3EEDD;margin-left:auto}
.chipnube i{width:9px;height:9px;border-radius:50%;background:#9AA6A2}
.chipnube.pruebas{background:#5A4300;border-color:#E5B54A;color:#FFE7A8}
.chipnube.produccion{background:#0E4A33;border-color:#62C08B;color:#CFF5DF}
.chipnube.st-ok i{background:#62C08B}.chipnube.st-error i{background:#F27A70}.chipnube.st-conectando i{background:#E5B54A}
.conex{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:end}
.conex fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:grid;gap:6px}
@media (max-width:640px){.conex{grid-template-columns:1fr}}
.volver{background:transparent;border:1px solid rgba(230,209,148,.5);color:var(--band-ink);border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:600;margin-bottom:12px}
.volver:hover{background:rgba(230,209,148,.12)}.volver:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.portada{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.pcard h2{font-size:30px;margin:2px 0 6px}.eyebrow{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--oro);font-weight:700}
.pbig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:14px}.pbig .val{font-family:var(--font-d);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--band);color:var(--band-ink);padding:10px 16px;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.25);z-index:9;max-width:90vw}
svg text{fill:var(--muted);font-family:var(--font-b);font-size:12px}
.vacio{padding:18px;text-align:center;color:var(--muted)}
@media (max-width:640px){.carga{grid-template-columns:1fr}.kpi .val{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.barra i{transition:width .4s ease}}
</style>
</head>

function previoDe(f){var c=ordenar(C()).filter(function(x){return x.fecha<f});return c.length?c[c.length-1]:null}

/* ---------- Lectura del archivo de LimeSurvey ---------- */
function procesar(file){
  return file.arrayBuffer().then(function(buf){
    if(typeof XLSX==='undefined')throw new Error('No se pudo cargar el lector de Excel. Revisa tu conexión a internet y recarga la página.');
    var wb=XLSX.read(buf,{type:'array'});
    var ws=wb.Sheets[wb.SheetNames[0]];
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:false});
    if(!rows.length)throw new Error('El archivo está vacío.');
    var hd=rows[0].map(H),idC=-1,subC=-1,tC=-1,sC=-1,eC=-1,pC=[],doc=MODO==='doc';
    hd.forEach(function(h,i){
      if(idC<0&&(h.indexOf('ID DE RESPUESTA')===0||h==='ID'))idC=i;
      if(subC<0&&h.indexOf('SUBSISTEMA')===0)subC=i;
      if(tC<0&&h.indexOf('TURNO')===0)tC=i;
      if(sC<0&&h.indexOf('SEMESTRE')===0)sC=i;
      if(h.indexOf('PLANTEL')===0)pC.push(i);
      if(eC<0&&h.indexOf('EDAD')===0&&h.indexOf('OTRO')<0)eC=i;
    });
    if(doc&&sC>=0)throw new Error('Este archivo parece ser de la encuesta de estudiantes (trae la columna de semestre). Cárgalo en el seguimiento de estudiantes.');
    if(!doc&&sC<0&&tC>=0&&pC.length)throw new Error('Este archivo parece ser de la encuesta de docentes (no trae la columna de semestre). Cárgalo en el seguimiento de docentes.');
    if(!pC.length||tC<0||(!doc&&sC<0))throw new Error('No encontré las columnas de plantel, turno o semestre. Exporta desde LimeSurvey con "Texto completo de la pregunta" como encabezado y "Respuestas completas" como formato de respuesta.');
    var g=PLANTELES.map(function(){return GC.map(function(){return 0})}),inc={},otras={},sinPlantel=0,sinDato=0,dup=0,vistos={},unicas=0,maxId=0;
    for(var r=1;r<rows.length;r++){
      var row=rows[r];
      if(!row||row.every(function(v){return String(v).trim()===''}))continue;
      var id=idC>=0?String(row[idC]).trim():'';
      if(id){if(vistos[id]){dup++;continue;}vistos[id]=1;var nid=parseInt(id,10);if(nid>maxId)maxId=nid;}
      unicas++;
      var raw='';for(var k=0;k<pC.length;k++){var v=String(row[pC[k]]||'').trim();if(v){raw=v;break;}}
      if(!raw){sinPlantel++;continue;}
      var key=normKey(raw),pi=KEYMAP[key];
      if(pi===undefined){
        var sub=subC>=0?String(row[subC]||'').trim():'';
        var nom=raw+(sub&&H(raw).indexOf(H(sub))<0?' ('+sub+')':'');
        otras[nom]=(otras[nom]||0)+1;continue;
      }
      if(doc){
        var ed=eC>=0?parseInt(String(row[eC]).trim(),10):NaN;
        if(!isNaN(ed)&&ed<EDAD_MIN_DOC){inc[pi]=inc[pi]||{};inc[pi].e=(inc[pi].e||0)+1;continue;}
        var tt=H(row[tC]),td=tt.indexOf('MIX')===0?2:tt.charAt(0)==='M'?0:tt.charAt(0)==='V'?1:null;
        if(td===null){inc[pi]=inc[pi]||{};inc[pi].x=(inc[pi].x||0)+1;continue;}
        g[pi][td]++;continue;
      }
      var t=turnoIdx(row[tC]),s=semIdx(row[sC]);
      if(t===null||s===null){sinDato++;inc[pi]=inc[pi]||{};inc[pi].x=(inc[pi].x||0)+1;continue;}
      var gi=t*3+s;
      if(PLANTELES[pi].meta[gi]===0){inc[pi]=inc[pi]||{};inc[pi][gi]=(inc[pi][gi]||0)+1;continue;}
      g[pi][gi]++;
    }
    return {mod:MODO,fecha:null,archivo:file.name,guardado:null,unicas:unicas,dup:dup,maxId:maxId,g:g,inc:inc,otras:otras,sinPlantel:sinPlantel};
  });
}

/* ---------- Cálculos ---------- */
function estado(p,esp,val){if(p>=1)return 'done';if(esp<=0)return val>0?'ok':'na';if(p>=esp)return 'ok';if(p>=0.75*esp)return 'warn';return 'bad';}
/* Conteos del plantel i en un corte. En planteles de turno continuo, las respuestas
   de vespertino (y mixto en docentes) se suman al turno matutino del mismo semestre.
   Se aplica al mostrar, así los cortes guardados conservan el dato original. */
function gDe(snap,i){
  var p=PLANTELES[i],g=snap&&snap.g[i]?snap.g[i].slice():GC.map(function(){return 0}),io0=snap&&snap.inc[i]||{},io={};
  for(var k in io0)io[k]=io0[k];
  if(p&&p.continuo){
    if(MODO==='doc'){g[0]+=(g[1]||0)+(g[2]||0);g[1]=0;g[2]=0;}
    else{[3,4,5].forEach(function(j){g[j-3]+=(g[j]||0)+(io[j]||0);g[j]=0;delete io[j];});}
  }
  return {g:g,io:io};
}
function totInc(o){return o?sumObj(o):0}
function calc(snap){
  var f=snap?snap.fecha:hoyISO(),prev=snap?previoDe(snap.fecha):null,dia=diaHabil(f),esp=dia/NDIAS;
  var filas=PLANTELES.map(function(p,i){
    var gi0=gDe(snap,i),g=gi0.g,io=gi0.io,it=totInc(io),val=0,rec=0,exc=0;
    if(MODO==='doc'){g.forEach(function(c){rec+=c;});val=Math.min(rec,p.metaT);exc=Math.max(0,rec-p.metaT);}
    else g.forEach(function(c,j){val+=Math.min(c,p.meta[j]);rec+=c;exc+=Math.max(0,c-p.meta[j]);});
    var tot=rec+it,nuevas=null;
    if(prev){var pt=gDe(prev,i).g.reduce(function(a,b){return a+b},0);nuevas=rec-pt;}else if(snap){nuevas=rec;}
    var pc=val/p.metaT,proy=dia>0?Math.min(1,(val+val/dia*(NDIAS-dia))/p.metaT):null;
    var ge=g.map(function(c,j){if(!p.meta[j])return (MODO==='doc'&&c)?{c:c,m:null,p:null,e:'na'}:null;var q=Math.min(c,p.meta[j])/p.meta[j];return {c:c,m:p.meta[j],p:q,e:estado(q,esp,c)};});
    return {i:i,p:p,g:g,ge:ge,io:io,it:it,val:val,rec:rec,exc:exc,tot:tot,nuevas:nuevas,pc:pc,proy:proy,e:estado(pc,esp,val)};
  });
  var valT=0,totT=0,excT=0,incT=0;filas.forEach(function(r){valT+=r.val;totT+=r.tot;excT+=r.exc;incT+=r.it;});
  var otrasT=snap?sumObj(snap.otras):0;
  return {snap:snap,prev:prev,fecha:f,dia:dia,esp:esp,filas:filas,valT:valT,totT:totT,excT:excT,incT:incT,otrasT:otrasT,
    sinPlantel:snap?snap.sinPlantel:0,unicas:snap?snap.unicas:0,nuevasG:snap?(prev?snap.unicas-prev.unicas:snap.unicas):null,
    pcT:valT/META_T,proyT:dia>0?Math.min(1,(valT+valT/dia*(NDIAS-dia))/META_T):null,eT:estado(valT/META_T,esp,valT)};
}
function subconjunto(c){
  var fs=c.filas.filter(function(r){return ui.sup==='todos'||r.p.sup===ui.sup});
  var m=0,v=0,t=0,nu=null;fs.forEach(function(r){m+=r.p.metaT;v+=r.val;t+=r.tot;if(r.nuevas!=null)nu=(nu||0)+r.nuevas;});
  var pc=m?v/m:0;
  return {filas:fs,meta:m,val:v,tot:t,nuevas:nu,pc:pc,proy:c.dia>0?Math.min(1,(v+v/c.dia*(NDIAS-c.dia))/m):null,e:estado(pc,c.esp,v),txt:SUP_TXT[ui.sup]};
}
function porRecibidas(fs){return fs.slice().sort(function(a,b){return b.rec-a.rec||b.pc-a.pc||a.i-b.i});}
function selSup(){var ne=PLANTELES.filter(function(p){return p.sup==='eliseo'}).length,na=PLANTELES.length-ne;return '<label class="small muted">Supervisor: <select id="sup"><option value="todos"'+(ui.sup==='todos'?' selected':'')+'>Todos ('+PLANTELES.length+' planteles)</option><option value="eliseo"'+(ui.sup==='eliseo'?' selected':'')+'>Eliseo Anaya ('+ne+')</option><option value="alberto"'+(ui.sup==='alberto'?' selected':'')+'>Alberto Morales ('+na+')</option></select></label>';}
function incLabel(k){return k==='x'?(MODO==='doc'?'Sin turno':'Sin turno o semestre'):k==='e'?'Edad menor a '+EDAD_MIN_DOC+' años (posible estudiante)':GRUPOS[k];}
function ordenFilas(c,fl){var f=(fl||c.filas).slice();if(ui.orden==='avance')f.sort(function(a,b){return b.pc-a.pc||a.i-b.i});return f;}

function kpi(l,v,s,extra){return '<div class="kpi"><div class="lab">'+l+'</div><div class="val">'+v+'</div><div class="sub">'+s+'</div>'+(extra||'')+'</div>'}
function pill(e){return '<span class="pill e-'+e+'">'+EST_TXT[e]+'</span>'}
function selOrden(){return '<label class="small muted">Ordenar: <select id="orden"><option value="avance"'+(ui.orden==='avance'?' selected':'')+'>Por avance</option><option value="lista"'+(ui.orden==='lista'?' selected':'')+'>Como en la lista</option></select></label>'}

function panelGrupos(c){
  var h='<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px"><span class="muted small">'+(MODO==='doc'?'Cada celda muestra respuestas / docentes del turno. Mixto: docentes que trabajan en ambos turnos (cuentan para el total).':'Cada celda muestra recibidas / meta del grupo. El color compara su avance con lo esperado a la fecha.')+'</span><span class="acciones">'+selSup()+selOrden()+'</span></div>';

function graficaSVG(cs){

function publicar(nuevo,msg){
  if(artifactNs){
    try{sessionStorage.setItem('cons26-flash',msg);sessionStorage.setItem('cons26-vista',ui.vista);}catch(e){}
    return artifactNs.publish(buildHTML(nuevo)).then(function(){state=nuevo;preview=null;render();},function(err){
      try{sessionStorage.removeItem('cons26-flash');}catch(e){}
      var code=err&&err.code;

      if(code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed'||code==='consent_required'){artifactNs=null;return guardarLocal(nuevo,msg);}
      toast('No se pudo guardar: '+((err&&err.message)||'error desconocido')+'. Intenta de nuevo en un momento.');
    });
  }

}

}
function aIdx(d){
  var M=MODS[d.encuesta];if(!M)return null;
  var g=M.P.map(function(p){var a=d.g&&d.g[p.n];return a?a.slice():M.GC.map(function(){return 0});});
  var inc={};Object.keys(d.inc||{}).forEach(function(n){var i=M.KM[normKey(n)];if(i!=null)inc[i]=d.inc[n];});
  return {mod:d.encuesta,fecha:d.fecha,archivo:d.archivo||'',huella:d.huella||'',unicas:d.unicas,dup:d.dup||0,maxId:d.maxId||0,g:g,inc:inc,otras:d.otras||{},sinPlantel:d.sinPlantel||0};
}
function aNombres(sn,mod){
  var M=MODS[mod],g={},inc={};
  M.P.forEach(function(p,i){var a=sn.g[i];if(a&&a.some(function(x){return x>0}))g[p.n]=M.GC.map(function(_,j){return a[j]||0});});
  Object.keys(sn.inc||{}).forEach(function(i){if(M.P[i])inc[M.P[i].n]=sn.inc[i];});
  return {encuesta:mod,fecha:sn.fecha,archivo:sn.archivo||'',huella:sn.huella||'',unicas:sn.unicas,dup:sn.dup||0,maxId:sn.maxId||0,sinPlantel:sn.sinPlantel||0,g:g,inc:inc,otras:sn.otras||{},version:APP_VERSION};
}
function cargarNube(){
  if(!nube.clave){nube.estado='sin-clave';render();return Promise.resolve();}
  nube.estado='conectando';nube.msg='';render();
  return api({accion:'leer'}).then(function(r){
    if(!r.ok){nube.estado='error';nube.msg=r.codigo==='clave'?'La clave no es correcta para '+ENT_TXT[nube.entorno]+'.':(r.mensaje||'Error del servidor.');render();return;}
    var esperado=nube.entorno==='produccion'?'PRODUCCION':'PRUEBAS';
    if(r.entorno!==esperado){nube.estado='error';nube.msg='La dirección configurada para '+ENT_TXT[nube.entorno]+' responde como '+r.entorno+'. Revisa las direcciones antes de guardar.';render();return;}
    var cv=function(l){return ordenar(l.map(function(x){var sn=aIdx(x.datos);if(sn){sn.fecha=x.fecha;sn.guardado=x.guardado;}return sn;}).filter(Boolean));};
    state={v:2,cortes:cv(r.datos.est||[]),cortesDoc:cv(r.datos.doc||[])};
    lsSet(cacheKey(),JSON.stringify(state));
    nube.estado='ok';nube.srv=r.entorno;render();
  }).catch(function(e){nube.estado='error';nube.msg='No se pudo conectar con la nube. Revisa tu conexión a internet.';render();});
}
function chipNube(){
  var t={'ok':'Conectado','conectando':'Conectando…','error':'Sin conexión','sin-clave':'Sin configurar'}[nube.estado];
  return '<button class="chipnube '+nube.entorno+' st-'+nube.estado+'" data-a="conexion" title="Configurar la conexión"><i></i>'+ENT_TXT[nube.entorno]+' · '+t+'</button>';
}
function panelConexion(){
  var h='';
  if(ui.conexion){
    h+='<section class="card" aria-labelledby="t-con"><h2 id="t-con">Conexión con la nube</h2><div class="conex">'+
      '<fieldset><legend class="small muted">Base de datos</legend>'+
      '<label><input type="radio" name="ent" value="pruebas"'+(nube.entorno==='pruebas'?' checked':'')+'> PRUEBAS <span class="muted small">(datos de ensayo)</span></label>'+
      '<label><input type="radio" name="ent" value="produccion"'+(nube.entorno==='produccion'?' checked':'')+'> PRODUCCIÓN <span class="muted small">(datos reales)</span></label></fieldset>'+
      '<div class="fecha"><label for="clave" class="small muted">Clave del entorno (se guarda solo en este navegador)</label><input type="password" id="clave" autocomplete="current-password" value="'+esc(nube.clave)+'"></div></div>'+
      '<div class="acciones" style="margin-top:12px"><button class="btn" data-a="conectar">Conectar</button><button class="btn sec" data-a="olvidar">Olvidar clave en este navegador</button><button class="btn sec" data-a="cerrar-con">Cerrar</button></div></section>';
  }else if(nube.estado==='sin-clave'){
    h+='<div class="aviso prev"><span>Para guardar y consultar cortes, configura la conexión con la nube.</span><button class="btn" data-a="conexion">Configurar conexión</button></div>';
  }else if(nube.estado==='error'){
    h+='<div class="aviso err" role="alert"><span>'+esc(nube.msg)+' Mientras tanto ves la última copia guardada en este navegador; no se pueden guardar cortes.</span><span class="acciones"><button class="btn sec" data-a="reintentar">Reintentar</button><button class="btn sec" data-a="conexion">Conexión</button></span></div>';
  }
  return h;
}
function guardarCorte(forzar){
  if(!preview||ui.guardando)return;
  if(nube.estado!=='ok'){toast('Conéctate a la nube antes de guardar.');return;}
  ui.guardando=true;render();
  var payload=aNombres(preview,MODO),f=preview.fecha;
  api({accion:'guardar',corte:payload,forzar:!!forzar}).then(function(r){
    ui.guardando=false;
    if(r.ok){preview=null;ui.confirmar=null;toastPend='Corte del '+fechaLarga(f)+' guardado en '+ENT_TXT[nube.entorno]+(r.reemplazo?' (reemplazó al corte anterior del mismo día).':'.');return cargarNube().then(function(){toastPend=null;});}
    if(r.confirmable){ui.confirmar=r.mensaje;render();return;}
    ui.confirmar=null;errorCarga='No se guardó el corte: '+(r.mensaje||'error del servidor');render();
  }).catch(function(){ui.guardando=false;errorCarga='No se pudo conectar con la nube; el corte NO se guardó. La vista previa sigue aquí: intenta de nuevo cuando tengas conexión.';render();});
}
function puedeDescargar(){return !!downloadsNs||!(window.claude&&window.claude.use);}
function salvar(nombre,data){
  if(!downloadsNs&&puedeDescargar()){
    try{var bl=data instanceof Blob?data:new Blob([data]);var u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=nombre;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},2000);}catch(e){toast('No se pudo descargar.');}
    return;
  }
  if(!downloadsNs){toast('La descarga no está disponible aquí. Usa "Copiar" o clic derecho sobre la imagen.');return;}
  var listo=false;
  setTimeout(function(){if(!listo)toast('El navegador no respondió a la descarga. Usa "Copiar imagen" o clic derecho sobre la imagen > Guardar imagen.');},10000);
  try{
    downloadsNs.save({filename:nombre,data:data}).then(function(){listo=true;toast('Descarga lista: '+nombre);},function(e){listo=true;if(e&&e.code==='declined')return;toast('No se pudo descargar (código: '+((e&&e.code)||'desconocido')+'). Usa clic derecho sobre la imagen > Guardar imagen.');});
  }catch(e){listo=true;toast('No se pudo descargar ('+(e&&e.message||'error')+').');}
}
function concentradoTSV(){
  if(MODO==='doc'){var cd=calc(vista()),LD=[['Plantel','Supervisor','Turno','Docentes','Respuestas','% avance','Estado'].join('\t')];
    cd.filas.forEach(function(r){r.ge.forEach(function(g,j){if(!g)return;LD.push([r.p.n,r.p.sup==='eliseo'?'Eliseo Anaya':'Alberto Morales',GRUPOS[j],g.m==null?'':g.m,g.c,g.p==null?'':Math.round(g.p*100),g.m==null?'':EST_TXT[g.e]].join('\t'));});LD.push([r.p.n,r.p.sup==='eliseo'?'Eliseo Anaya':'Alberto Morales','Total',r.p.metaT,r.rec,Math.round(r.pc*100),EST_TXT[r.e]].join('\t'));});
    return LD.join('\n');}
  var c=calc(vista()),L=[['Plantel','Supervisor','Turno','Semestre','Matrícula','Meta','Recibidas','Válidas','% avance','Faltan','Estado'].join('\t')];
  c.filas.forEach(function(r){r.ge.forEach(function(g,j){if(!g)return;L.push([r.p.n,r.p.sup==='eliseo'?'Eliseo Anaya':'Alberto Morales',j<3?'Matutino':'Vespertino',[1,3,5][j%3],r.p.mat[j],g.m,g.c,Math.min(g.c,g.m),Math.round(g.p*100),Math.max(0,g.m-g.c),EST_TXT[g.e]].join('\t'));});});
  return L.join('\n');
}
function exportarXLSX(){
  var c=calc(vista());if(!c.snap||typeof XLSX==='undefined')return;
  var wb=XLSX.utils.book_new();
  var a=[['Plantel','Meta','Válidas','% avance','Respuestas recibidas','Nuevas desde corte anterior','Excedente','Proyección al cierre','Estado']];
  c.filas.forEach(function(r){a.push([r.p.n,r.p.metaT,r.val,Math.round(r.pc*1000)/10,r.tot,r.nuevas,r.exc,r.proy==null?'':Math.round(r.proy*1000)/10,EST_TXT[r.e]]);});
  a.push(['Total',META_T,c.valT,Math.round(c.pcT*1000)/10,c.totT,c.nuevasG,c.excT,c.proyT==null?'':Math.round(c.proyT*1000)/10,EST_TXT[c.eT]]);
  a.push([]);a.push(['Corte: '+c.fecha+' · Día hábil '+c.dia+' de '+NDIAS+' · Esperado a la fecha: '+Math.round(c.esp*100)+' %']);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),'Avance por plantel');
  var b;
  if(MODO==='doc'){b=[['Plantel','Turno','Docentes','Respuestas','% avance','Estado']];c.filas.forEach(function(r){r.ge.forEach(function(g,j){if(!g)return;b.push([r.p.n,GRUPOS[j],g.m==null?'':g.m,g.c,g.p==null?'':Math.round(g.p*1000)/10,g.m==null?'':EST_TXT[g.e]]);});});}
  else{b=[['Plantel','Turno','Semestre','Matrícula','Meta','Recibidas','Válidas','% avance','Faltan','Estado']];
  c.filas.forEach(function(r){r.ge.forEach(function(g,j){if(!g)return;b.push([r.p.n,j<3?'Matutino':'Vespertino',[1,3,5][j%3],r.p.mat[j],g.m,g.c,Math.min(g.c,g.m),Math.round(g.p*1000)/10,Math.max(0,g.m-g.c),EST_TXT[g.e]]);});});}
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(b),MODO==='doc'?'Por turno':'Por turno y semestre');
  var o=[['Escuela señalada','Respuestas']];Object.keys(c.snap.otras).forEach(function(k){o.push([k,c.snap.otras[k]]);});
  c.filas.forEach(function(r){for(var k in r.io)o.push([r.p.n+' — '+incLabel(k),r.io[k]]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(o),'Por revisar');
  var hh=[['Corte','Día hábil','Respuestas en archivo','Válidas','% avance','% esperado']];
  ordenar(C()).forEach(function(s){var k=calc(s);hh.push([s.fecha,k.dia,s.unicas,k.valT,Math.round(k.pcT*1000)/10,Math.round(k.esp*1000)/10]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(hh),'Historial');
  var out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  salvar('Avance_consulta_'+T().archivo+'_'+c.fecha+'.xlsx',new Blob([out]));
}

/* ---------- Eventos ---------- */
function huellaDe(file){try{if(!(window.crypto&&crypto.subtle))return Promise.resolve('');return file.arrayBuffer().then(function(b){return crypto.subtle.digest('SHA-256',b);}).then(function(d){return Array.prototype.map.call(new Uint8Array(d),function(x){return ('0'+x.toString(16)).slice(-2)}).join('');}).catch(function(){return '';});}catch(e){return Promise.resolve('');}}
function cargar(file){
  if(!file)return;errorCarga=null;
  var f=($('#fcorte')&&$('#fcorte').value)||hoyISO();
  procesar(file).then(function(s){return huellaDe(file).then(function(h){s.huella=h;return s;});}).then(function(s){s.fecha=f;preview=s;ui.confirmar=null;ui.tab='planteles';render();},function(e){errorCarga=e.message||String(e);preview=null;render();});
}
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='arch'){cargar(t.files[0]);t.value='';}
  else if(t.id==='fcorte'){if(preview&&t.value){preview.fecha=t.value;render();}}
  else if(t.id==='orden'){ui.orden=t.value;render();}
  else if(t.id==='sup'){ui.sup=t.value;render();}
  else if(t.id==='restaurar'&&t.files[0]){
    t.files[0].text().then(function(txt){restaurar(txt);}).catch(function(){toast('Ese archivo no es un respaldo válido del historial.');});
    t.value='';
  }
});
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-a],[data-tab],[data-ir],tr.fila');if(!b)return;
  if(b.dataset.ir){ir(b.dataset.ir);return;}
  if(b.dataset.tab){ui.tab=b.dataset.tab;render();return;}
  if(b.classList.contains('fila')){var i=+b.dataset.p;ui.abierto=ui.abierto===i?null:i;render();return;}
  var a=b.dataset.a;
  if(a==='guardar')guardarCorte(false);
  else if(a==='forzar')guardarCorte(true);
  else if(a==='cancelar-conf'){ui.confirmar=null;render();}
  else if(a==='conexion'){ui.conexion=true;render();var ci=$('#clave');if(ci)ci.focus();}
  else if(a==='cerrar-con'){ui.conexion=false;render();}
  else if(a==='reintentar')cargarNube();
  else if(a==='olvidar'){nube.clave='';lsSet('cons26-clave',null);nube.estado='sin-clave';render();}
  else if(a==='conectar'){var ent=(document.querySelector('input[name=ent]:checked')||{}).value||'pruebas',cl=($('#clave')||{}).value||'';
    if(ent!==nube.entorno){previews={est:null,doc:null};preview=null;ui.confirmar=null;}
    nube.entorno=ent;nube.clave=cl.trim();lsSet('cons26-entorno',ent);lsSet('cons26-clave',nube.clave||null);ui.conexion=false;usarCache();cargarNube();}
  else if(a==='descartar'){preview=null;ui.confirmar=null;render();}
  else if(a==='cerrar-err'){errorCarga=null;render();}
  else if(a==='borrar'){ui.borrar=b.dataset.f;render();}
  else if(a==='borrar-no'){ui.borrar=null;render();}
  else if(a==='borrar-si'){var f=b.dataset.f;ui.borrar=null;
    if(nube.estado!=='ok'){toast('Conéctate a la nube para eliminar cortes.');render();return;}
    api({accion:'eliminar',encuesta:MODO,fecha:f}).then(function(r){if(!r.ok){toast('No se eliminó: '+r.mensaje);return;}toastPend='Corte del '+fechaLarga(f)+' eliminado de '+ENT_TXT[nube.entorno]+'.';return cargarNube().then(function(){toastPend=null;});}).catch(function(){toast('No se pudo conectar con la nube.');});}
  else if(a==='respaldo')salvar('historial_consultas_2026_'+hoyISO()+'.json',JSON.stringify(state,null,1));
  else if(a==='xlsx')exportarXLSX();
  else if(a==='cp-tsv'){navigator.clipboard.writeText(concentradoTSV()).then(function(){toast('Concentrado copiado. Pégalo en una hoja de Excel.')},function(){toast('No se pudo copiar el concentrado.')});}
  else if(a==='cp-resp'){navigator.clipboard.writeText(JSON.stringify(state)).then(function(){toast('Respaldo copiado. Pégalo en una nota o en un archivo de texto y guárdalo.')},function(){toast('No se pudo copiar el respaldo.')});}
  else if(a==='pegar-resp'){ui.pegar=true;render();}
  else if(a==='cancelar-resp'){ui.pegar=false;render();}
  else if(a==='aplicar-resp'){ui.pegar=false;restaurar($('#txt-resp').value);}
  else if(a==='cp-txt'){var m=$('#msg');navigator.clipboard.writeText(m.textContent).then(function(){toast('Mensaje copiado. Pégalo en WhatsApp.')},function(){toast('No se pudo copiar; selecciona el texto y cópialo manualmente.')});}
  else if(a==='dl-img'){var k=b.dataset.k,bl=IMG[k+'B'];if(!bl){toast('La imagen aún se está preparando; intenta de nuevo en un segundo.');return;}salvar((k==='res'?'Avance_planteles_':'Avance_grupos_')+T().archivo+'_'+(ui.sup==='todos'?'':ui.sup+'_')+calc(vista()).fecha+'.png',bl);}
  else if(a==='cp-img'){var cv2=IMG[b.dataset.k];if(!cv2)return;
    try{var item=new ClipboardItem({'image/png':blobDe(cv2)});navigator.clipboard.write([item]).then(function(){toast('Imagen copiada. Pégala en WhatsApp Web.')},function(){toast('Tu navegador no permitió copiar la imagen. Usa clic derecho sobre ella > Copiar imagen.')});}
    catch(e){toast('Tu navegador no permitió copiar la imagen. Usa clic derecho sobre ella > Copiar imagen.');}}
});
document.addEventListener('keydown',function(ev){
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&(ev.target.matches('tr.fila,#drop,label[for="restaurar"]'))){ev.preventDefault();if(ev.target.id==='drop')$('#arch').click();else ev.target.click();}
});
['dragover','dragenter'].forEach(function(n){document.addEventListener(n,function(ev){var d=ev.target.closest&&ev.target.closest('#drop');if(d){ev.preventDefault();d.classList.add('over');}});});
document.addEventListener('dragleave',function(ev){var d=ev.target.closest&&ev.target.closest('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',function(ev){var d=ev.target.closest&&ev.target.closest('#drop');if(d){ev.preventDefault();d.classList.remove('over');cargar(ev.dataTransfer.files[0]);}});

function restaurar(txt){
  var st;try{st=JSON.parse(txt);if(!st||!Array.isArray(st.cortes))throw 0;}catch(e){toast('Ese respaldo no es válido.');return;}
  if(nube.estado!=='ok'){toast('Conéctate a la nube antes de importar.');return;}
  var cola=[];(st.cortes||[]).forEach(function(x){cola.push(aNombres(x,'est'));});(st.cortesDoc||[]).forEach(function(x){cola.push(aNombres(x,'doc'));});
  var ok=0,mal=[];
  function sig(){
    if(!cola.length){toastPend='Importación a '+ENT_TXT[nube.entorno]+': '+ok+' cortes guardados'+(mal.length?'; '+mal.length+' no se guardaron ('+mal.join(' | ')+')':'')+'.';return cargarNube().then(function(){toastPend=null;});}
    var c=cola.shift();
    return api({accion:'guardar',corte:c}).then(function(r){if(r.ok)ok++;else mal.push(c.encuesta+' '+c.fecha+': '+r.mensaje);return sig();});
  }
  toast('Importando '+cola.length+' cortes…');
  sig().catch(function(){toast('Se interrumpió la importación por falta de conexión. Lo ya importado quedó guardado.');});
}
var HASH={est:'estudiantes',doc:'docentes'};
function ir(v,sinHash){
  if(v!=='est'&&v!=='doc')v='portada';
  if(v!=='portada'&&v!==MODO)setMod(v);
  if(v!==ui.vista){ui.tab='planteles';ui.abierto=null;ui.borrar=null;ui.pegar=false;errorCarga=null;}
  ui.vista=v;
  if(!sinHash){try{var hh=v==='portada'?'':HASH[v];if(location.hash.slice(1)!==hh){if(hh)location.hash=hh;else history.replaceState(null,'',location.pathname+location.search);}}catch(e){}}
  render();window.scrollTo(0,0);
}
function vistaInicial(){var h='';try{h=location.hash.slice(1);}catch(e){}if(h==='estudiantes')return 'est';if(h==='docentes')return 'doc';try{var s=sessionStorage.getItem('cons26-vista');if(s){sessionStorage.removeItem('cons26-vista');return s;}}catch(e){}return 'portada';}
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);ir(h==='estudiantes'?'est':h==='docentes'?'doc':'portada',true);});
ir(vistaInicial(),true);
cargarNube();
if(window.claude&&typeof window.claude.use==='function'){
  Promise.all([window.claude.use('artifact').catch(function(){return null}),window.claude.use('downloads').catch(function(){return null})]).then(function(r){artifactNs=r[0];downloadsNs=r[1];capListo=true;render();});
}else{capListo=true;}
window.__consulta={procesar:procesar,calc:calc,normKey:normKey,DIAS:DIAS,META_T:META_T,buildHTML:buildHTML,setPreview:function(s){preview=s;render();},setTab:function(t){ui.tab=t;render();},ir:ir};
})();
</script>
